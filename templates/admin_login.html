<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EliteAI Admin — Login</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --bg-card: #16161f;
            --text: #f0f0f5;
            --text-muted: #6b6b80;
            --accent: #6366f1;
            --gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --border: rgba(255,255,255,0.06);
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: 48px; width: 400px; max-width: 90vw;
            text-align: center;
        }
        .logo {
            font-weight: 800; font-size: 1.5rem; margin-bottom: 8px;
            background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 32px; }
        input {
            width: 100%; padding: 12px 16px; background: var(--bg);
            border: 1px solid var(--border); border-radius: 10px; color: var(--text);
            font-size: 1rem; font-family: inherit; margin-bottom: 16px;
        }
        input:focus { outline: none; border-color: var(--accent); }
        button {
            width: 100%; padding: 12px; background: var(--gradient);
            border: none; border-radius: 10px; color: white; font-size: 1rem;
            font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        button:hover { opacity: 0.9; }
        .error { color: var(--danger); font-size: 0.85rem; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">EliteAI Admin</div>
        <div class="subtitle">Enter your admin password to continue</div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="Password" autofocus required>
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
